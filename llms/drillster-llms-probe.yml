# Negative probe result — recorded deliberately.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file IS that artifact. It makes repo_has?(slug,'llms')
# true so the unprobed-pointer fallback stops firing, while carrying no .txt so
# llms_txt_present? stays false. The check therefore returns a TRUE zero, backed
# by a fetched URL and a status code, instead of a false credit.
#
# Same posture as the well-known probe artifacts: a recorded absence is a valid
# measurement. Do not delete this to 'clean up' — deleting it restores the bug.
llms:
  probed: '2026-09-06'
  url: https://drillster.com/llms.txt
  verdict: absent
  published: false
  detail: HTTP 404
  note: >-
    Re-probed 2026-09-06. Drillster serves no llms.txt on either host: GET
    https://drillster.com/llms.txt returned 404 and GET https://www.drillster.com/llms.txt
    returned 404 (the site's HTML "Not found" page, 33,405 bytes). The stale apis.yml pointer
    that declared https://drillster.com/llms.txt was removed in the same pass. An API
    Evangelist-generated llms.txt now lives at llms/drillster-llms.txt (method: generated);
    it is OUR artifact and makes no claim that Drillster publishes one.
