specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Drillster
providerId: drillster
created: '2026-05-04'
modified: '2026-09-06'
generated: '2026-09-06'
method: searched
source: https://drillster.com/en/pricing
note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that invented a Free / Professional / Enterprise
  ladder with made-up quotas (1,000 and 100,000 requests a month) and made-up rate limits.
  None of that was Drillster's. Drillster publishes ONE plan. Everything below is read from
  the published pricing page on 2026-09-06.
tags:
  - Assessments
  - Education
  - Learning
  - Quizzes
  - Training
  - LMS
description: >-
  Drillster sells a single annual, per-user enterprise licence. The pricing page states one
  plan with every product capability included, a stated entry point of EUR 5,000 per year,
  and a demo booking for a tailored quote. There is no self-service tier, no free tier, no
  published API request quota and no per-call pricing — API access, SSO, SCORM and the LTI
  connector are integration capabilities of the licence rather than separately metered
  products.
plan_count: 1
billing:
  model: per-user annual licence
  term: yearly
  currency: EUR
  entry_price: 5000
  entry_price_note: 'Published as "Projects start at EUR 5,000 per year".'
  quote: 'tailored — book a demo'
  self_service: false
  free_tier: false
  trial: not published
plans:
  - id: drillster-enterprise
    name: Enterprise plan
    type: enterprise
    price: '5000.00'
    currency: EUR
    period: year
    price_qualifier: starting price for a project; final price scales with user count
    description: >-
      "Drillster runs on a yearly, user-based model. Pricing is tied to your users, so your
      budget stays predictable as rollout expands." Every Drillster licence includes the full
      adaptive learning app suite; integrations, AI content creation and specialist services
      are add-ons under a separate agreement.
    entries: []
    entries_note: >-
      Drillster publishes no metered entries — no request quota, no overage rate, no
      per-endpoint charge. The billable unit is the licensed user, not the API call. Recorded
      as empty by measurement.
    elements:
      - name: Drillster learning app (web, iOS, Android)
      - name: Unlimited drills, stories and courses
      - name: Unlimited practice sessions
      - name: Email and push notifications
      - name: Drillster Question Crafter (AI content creation)
      - name: Reporting (proficiency and challenge results)
      - name: Integrations — SSO, SCORM, LTI and connectors, available on demand
      - name: Drillster REST API 2.1.1
      - name: Event notification service (webhooks)
    add_ons_note: >-
      The pricing page marks some capabilities as "additional cost require a separate
      agreement"; the itemised split is not published as a price list.
discount_programs:
  - name: Education and non-profit pricing
    description: >-
      Special pricing for qualifying educational institutions and non-profit organizations,
      assessed case by case.
    url: https://drillster.com/en/pricing
api_pricing:
  metered: false
  note: >-
    The API reference states non-commercial use of the API is free of charge and that
    commercial use requires prior arrangement —
    https://www.drillster.com/info/developers/api/2.1.1/ . The LTI connector is explicitly
    "included in the standard license fees".
