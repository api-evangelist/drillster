apis:
  - aid: drillster:drillster-api
    name: Drillster API
    description: >-
      The Drillster REST API (v2.1.1) lets developers integrate Drillster's adaptive learning
      and training platform into external applications. Roughly 180 documented endpoints and
      200 response objects cover user account provisioning, group and staff management, group
      membership and invitations, catalogs and subscriptions, drills, playables and
      repertoire, tests and test results, objectives and evaluations, and organization
      administration. Requests are JSON over HTTPS with OAuth 2.0 bearer tokens; write
      operations are form-encoded. Event notifications are delivered separately over webhooks.
    humanURL: https://www.drillster.com/info/developers/api/2.1.1/
