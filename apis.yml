aid: drillster
name: Drillster
description: >-
  Drillster is a Utrecht-based adaptive learning platform for corporate and vocational
  training, built on repetition-based drills that schedule practice at the moment a learner is
  about to forget. Customers in aviation, healthcare, financial services, energy, railway and
  construction use it to keep safety- and compliance-critical knowledge reliable year-round.
  For developers, Drillster publishes a documented REST API (version 2.1.1, JSON over HTTPS,
  OAuth 2.0 with a JWT-bearer service-account grant) covering user provisioning, group and
  membership management, catalogs, drills, tests, objectives and results reporting; an
  outbound event notification service with seven webhook event types and a seven-day retry
  contract; an embeddable widget family with a JavaScript loader; and standards-based LMS
  integration through LTI 1.0/1.3, SCORM 1.2 and OpenID Connect single sign-on.
