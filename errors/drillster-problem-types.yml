generated: '2026-09-06'
method: searched
source: https://www.drillster.com/info/developers/api/2.1.1/endpoints/
format: proprietary
note: 'Drillster publishes no OpenAPI, so this catalogue was harvested from the per-endpoint "Error responses"
  tables in the 2.1.1 HTML reference. It is a SAMPLE, not the whole registry: 18 of the ~180 documented
  endpoints were read and 79 distinct error id + status pairs came back. Every id below is quoted verbatim
  from the endpoint page named in observed_on. Drillster does not use RFC 9457 problem+json; it returns
  its own two-field Error object, documented at the objects/error reference below.'
envelope:
  media_type: application/json
  object: Error
  docs: https://www.drillster.com/info/developers/api/2.1.1/objects/error/
  fields:
  - name: id
    type: String
    required: true
    description: A string to identify the error type. This is the field an application should branch on.
  - name: description
    type: String
    required: true
    description: A human readable description of the issue. Drillster says this can usually be ignored
      by the application.
  example:
    id: not_authenticated
    description: User was not authenticated
status_codes:
- status: 200
  meaning: OK — everything went OK.
- status: 201
  meaning: Created — the request resulted in the creation of a new resource.
- status: 204
  meaning: No Content — processed successfully, no body returned.
- status: 304
  meaning: Not Modified — there was no new data to return.
- status: 400
  meaning: Bad Request — the request is invalid; an Error object explains why.
- status: 401
  meaning: Not Authorized — credentials missing or invalid.
- status: 403
  meaning: Forbidden — request understood but refused.
- status: 404
  meaning: Not Found — invalid URI or the resource does not exist.
- status: 500
  meaning: Internal Server Error — something went wrong in the Drillster application.
- status: 502
  meaning: Bad Gateway — Drillster is down or being upgraded.
- status: 503
  meaning: Service Unavailable — servers up but overloaded; try again later.
coverage:
  endpoints_documented_total: 180
  endpoints_sampled: 18
  problems_captured: 79
  note: Re-run against more endpoint pages to extend; the ids are stable and namespaced per endpoint.
